name: Update prices
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; UEX refreshes most data daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_data.py
        env:
          UEX_TOKEN: ${{ secrets.UEX_TOKEN }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update prices" && git push)
